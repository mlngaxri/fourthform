name: Deploy Fourthform production

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: fourthform-production
  cancel-in-progress: true

jobs:
  marketing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/marketing
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_CGpuPPobiY1sG5d7RhVa7Qsh
      VERCEL_PROJECT_ID: prj_xXlnslAC5AIPsR7JibEda1NgjbEL
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/marketing/package-lock.json
      - name: Check Vercel deployment credential
        run: |
          test -n "$VERCEL_TOKEN" || (echo "VERCEL_TOKEN is not configured" && exit 1)
      - run: npm ci
      - name: Install pinned Vercel CLI
        run: npm install --global vercel@54.15.1
      - name: Pull production configuration
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build production
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy production
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

  portal:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/portal
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_CGpuPPobiY1sG5d7RhVa7Qsh
      VERCEL_PROJECT_ID: prj_eroqPitRgT4h6JRDB6cc8PpFlERS
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/portal/package-lock.json
      - name: Check Vercel deployment credential
        run: |
          test -n "$VERCEL_TOKEN" || (echo "VERCEL_TOKEN is not configured" && exit 1)
      - run: npm ci
      - name: Install pinned Vercel CLI
        run: npm install --global vercel@54.15.1
      - name: Pull production configuration
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build production
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy production
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
