name: Validate marketing and portal preview
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      PREVIEW_URL: http://127.0.0.1:3000
      PORTAL_URL: http://127.0.0.1:3000/portal-preview/index.html
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:structure
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start local production preview
        run: |
          npm run start -- --port 3000 > preview-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat preview-server.log
          exit 1
      - run: node tests/browser/concepts-and-spaces.mjs
      - run: npm run test:browser
      - run: node tests/browser/details-check.mjs
      - run: node tests/browser/review-check.mjs
      - run: node tests/browser/integration-check.mjs
      - run: node tests/browser/audit-check.mjs
      - run: node tests/browser/content-check.mjs
      - run: node tests/browser/portfolio-check.mjs
      - run: node tests/browser/visual-tour.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-verification
          path: |
            docs/preview-evidence
            preview-server.log
          retention-days: 7
